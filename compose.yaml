name: commerce-operations-explorer
services:
  db:
    image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    environment:
      POSTGRES_DB: commerce
      POSTGRES_USER: commerce_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.py first}
    ports:
      - "127.0.0.1:5483:5432"
    volumes:
      - commerce_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce_owner -d commerce"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  commerce_db:
